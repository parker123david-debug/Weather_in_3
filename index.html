<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тактичний Метео-Монітор · MGRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111613;
    --panel-bg: #18201b;
    --card-bg: #1e2722;
    --ink: #e1e9e3;
    --ink-soft: #9cb0a3;
    --ink-faint: #65776c;
    --line: #2a362f;
    --tactical-bg: #141b17;
    
    /* Кольори погоди */
    --badge-clear: #d97706;
    --badge-cloudy: #6b7280;
    --badge-rain: #4a6572;
    --badge-thunder: #0284c7;

    /* Статуси допуску */
    --ok: #2eb85c;
    --ok-bg: rgba(46, 184, 92, 0.18);
    --warn: #f39c12;
    --warn-bg: rgba(243, 156, 18, 0.22);
    --danger: #e74c3c;
    --danger-bg: rgba(231, 76, 60, 0.25);

    --radius: 10px;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --display: 'Space Grotesk', var(--sans);
    --mono: 'JetBrains Mono', monospace;
  }

  [data-theme="light"] {
    --bg: #dbe2dc;
    --panel-bg: #f2f5f3;
    --card-bg: #ffffff;
    --ink: #16221c;
    --ink-soft: #55665c;
    --ink-faint: #8a988e;
    --line: #cbd5ce;
    --tactical-bg: #edf1ee;
    --badge-clear: #b45309;
    --badge-cloudy: #4b5563;
    --badge-rain: #374151;
    --badge-thunder: #0369a1;
  }

  * { box-sizing: border-box; }
  html { font-size: 13px; }
  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 1rem;
    color: var(--ink);
    background: var(--bg);
    min-height: 100vh;
    padding: 14px;
  }

  /* На всю ширину вікна */
  .app-container { 
    width: 100%; 
    max-width: 100%; 
    display: flex; 
    flex-direction: column; 
    gap: 14px; 
  }

  /* Шапка */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-bg);
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 10px;
  }
  .top-title { font-family: var(--mono); font-size: 1.07rem; font-weight: 700; text-transform: uppercase; color: var(--ink-soft); margin: 0; }

  .btn {
    font-family: var(--sans);
    font-size: 0.92rem;
    font-weight: 600;
    background: var(--card-bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn:hover { opacity: 0.85; }
  .btn-main { background: var(--ink); color: var(--bg); border: none; }
  .btn-action { color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
  .btn-del { color: var(--danger); border-color: transparent; padding: 5px; font-size: 1rem; background: transparent;}
  .btn-del:hover { background: var(--danger-bg); border-color: var(--danger); }

  /* Сітка НП */
  .np-row-grid {
    display: grid;
    gap: 14px;
    align-items: start;
    width: 100%;
    overflow-x: auto; /* Дозволяє скролити, якщо карток забагато */
    padding-bottom: 5px;
  }

  .np-column {
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 400px; /* Запобігає надмірному звуженню стовпчика */
  }

  .np-header { display: flex; flex-direction: column; gap: 6px; }

  .search-row { display: flex; gap: 6px; }
  .search-row input {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 6px 9px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 0.85rem;
    outline: none;
  }

  .np-title { font-family: var(--display); font-size: 1.7rem; font-weight: 700; margin: 2px 0 0 0; }
  
  .np-meta { 
    font-size: 0.85rem; 
    color: var(--ink-soft); 
    display: flex; 
    flex-wrap: wrap; 
    align-items: center; 
    gap: 6px; 
  }
  .np-coords { font-family: var(--mono); color: var(--ink-soft); }
  
  .mgrs-tag {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.85rem;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.12);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    letter-spacing: 0.03em;
  }
  [data-theme="light"] .mgrs-tag {
    color: #0284c7;
    background: rgba(2, 132, 199, 0.1);
    border-color: rgba(2, 132, 199, 0.3);
  }

  .days-list { display: flex; flex-direction: column; gap: 10px; }

  /* КАРТКА ПРОГНОЗУ */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: stretch;
  }

  @media (max-width: 600px) {
    .card { grid-template-columns: 1fr; }
  }

  .card-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-right: 1px solid var(--line);
    padding-right: 10px;
  }

  @media (max-width: 600px) {
    .card-left { border-right: none; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  }

  .card-right {
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: space-between;
  }

  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .day-group { display: flex; align-items: baseline; gap: 6px; }
  .wday { font-family: var(--display); font-weight: 700; font-size: 1.23rem; }
  .date-str { font-family: var(--mono); font-size: 0.8
